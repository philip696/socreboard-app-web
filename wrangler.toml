name = "scoreboard-app-web"

# Cloudflare Pages configuration (ESR build output)
pages_build_output_dir = "dist/"

# Production environment variables (set in Cloudflare Pages dashboard)
[env.production]
vars = { ENVIRONMENT = "production" }

# Preview environment variables
[env.preview]
vars = { ENVIRONMENT = "preview" }

# Note: Set these environment variables in Cloudflare Pages dashboard:
# - FIREBASE_API_KEY
# - FIREBASE_AUTH_DOMAIN
# - FIREBASE_PROJECT_ID
# - FIREBASE_STORAGE_BUCKET
# - FIREBASE_MESSAGING_SENDER_ID
# - FIREBASE_APP_ID
